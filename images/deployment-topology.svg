<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="320" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="13" fill="#999">Deployment topology (illustrative)</text>
  <!-- Client -->
  <rect x="40" y="130" width="120" height="60" rx="6" fill="#dcecf5" stroke="#4a90b8" stroke-width="1.5"/>
  <text x="100" y="156" text-anchor="middle" font-size="12.5" fill="#123">Browser</text>
  <text x="100" y="173" text-anchor="middle" font-size="10.5" fill="#567">SPA client</text>
  <!-- LB -->
  <rect x="210" y="130" width="120" height="60" rx="6" fill="#e6f2e9" stroke="#3f8f5b" stroke-width="1.5"/>
  <text x="270" y="156" text-anchor="middle" font-size="12.5" fill="#123">Load Balancer</text>
  <text x="270" y="173" text-anchor="middle" font-size="10.5" fill="#567">TLS termination</text>
  <!-- App tier -->
  <rect x="380" y="70" width="130" height="56" rx="6" fill="#dcecf5" stroke="#4a90b8" stroke-width="1.5"/>
  <text x="445" y="94" text-anchor="middle" font-size="12" fill="#123">API node 1</text>
  <text x="445" y="111" text-anchor="middle" font-size="10.5" fill="#567">business logic</text>
  <rect x="380" y="196" width="130" height="56" rx="6" fill="#dcecf5" stroke="#4a90b8" stroke-width="1.5"/>
  <text x="445" y="220" text-anchor="middle" font-size="12" fill="#123">API node 2</text>
  <text x="445" y="237" text-anchor="middle" font-size="10.5" fill="#567">business logic</text>
  <!-- DB -->
  <ellipse cx="575" cy="150" rx="30" ry="9" fill="#e7ddf2" stroke="#7a5aa0" stroke-width="1.5"/>
  <path d="M545,150 v40 a30,9 0 0,0 60,0 v-40" fill="#e7ddf2" stroke="#7a5aa0" stroke-width="1.5"/>
  <text x="575" y="178" text-anchor="middle" font-size="10.5" fill="#423">Postgres</text>
  <!-- arrows -->
  <line x1="160" y1="160" x2="206" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="330" y1="150" x2="376" y2="105" stroke="#444" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="330" y1="170" x2="376" y2="220" stroke="#444" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="510" y1="100" x2="548" y2="140" stroke="#444" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="510" y1="222" x2="548" y2="180" stroke="#444" stroke-width="1.5" marker-end="url(#a2)"/>
</svg>
