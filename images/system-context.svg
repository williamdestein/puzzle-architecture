<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <!-- User -->
  <circle cx="60" cy="150" r="18" fill="#eef2f7" stroke="#4a6a8a" stroke-width="1.5"/>
  <line x1="60" y1="168" x2="60" y2="200" stroke="#4a6a8a" stroke-width="1.5"/>
  <line x1="42" y1="180" x2="78" y2="180" stroke="#4a6a8a" stroke-width="1.5"/>
  <text x="60" y="225" text-anchor="middle" font-size="13" fill="#222">User</text>
  <!-- Puzzlefin boundary -->
  <rect x="150" y="40" width="330" height="220" rx="8" fill="none" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="165" y="60" font-size="12" fill="#999">Puzzlefin</text>
  <!-- Web App -->
  <rect x="180" y="120" width="110" height="56" rx="6" fill="#dcecf5" stroke="#4a90b8" stroke-width="1.5"/>
  <text x="235" y="145" text-anchor="middle" font-size="12.5" fill="#123">Web App</text>
  <text x="235" y="162" text-anchor="middle" font-size="10.5" fill="#567">Presentation</text>
  <!-- API -->
  <rect x="330" y="120" width="110" height="56" rx="6" fill="#dcecf5" stroke="#4a90b8" stroke-width="1.5"/>
  <text x="385" y="145" text-anchor="middle" font-size="12.5" fill="#123">API</text>
  <text x="385" y="162" text-anchor="middle" font-size="10.5" fill="#567">Business Logic</text>
  <!-- Database -->
  <path d="M355,215 a30,8 0 0,0 60,0 v-26 a30,8 0 0,0 -60,0 z" fill="#e7ddf2" stroke="#7a5aa0" stroke-width="1.5"/>
  <ellipse cx="385" cy="189" rx="30" ry="8" fill="#e7ddf2" stroke="#7a5aa0" stroke-width="1.5"/>
  <text x="385" y="212" text-anchor="middle" font-size="10.5" fill="#423">Database</text>
  <!-- External -->
  <rect x="510" y="120" width="110" height="56" rx="6" fill="#f2ece0" stroke="#b8934a" stroke-width="1.5"/>
  <text x="565" y="145" text-anchor="middle" font-size="12" fill="#321">External</text>
  <text x="565" y="162" text-anchor="middle" font-size="10.5" fill="#654">Service</text>
  <!-- arrows -->
  <line x1="82" y1="150" x2="176" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="292" y1="148" x2="326" y2="148" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="385" y1="178" x2="385" y2="178" stroke="#444" stroke-width="1.5"/>
  <line x1="385" y1="176" x2="385" y2="176" stroke="#444" stroke-width="1.5"/>
  <line x1="385" y1="176" x2="385" y2="181" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="442" y1="148" x2="506" y2="148" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
